name: Weekly Model Recommendations Update

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_pr:
        description: 'Force creating a PR even if no price/model shifts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-model-recommendations:
    name: Scan OpenRouter Catalog & Propose Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Model Catalog Evaluator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/update_recommendations.py --apply

      - name: Push Automated Update Branch & Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git checkout -B automated/model-updates
            git add claude-threepio MODEL_RECOMMENDATIONS_REPORT.md
            git commit -m "chore(models): weekly openrouter recommendations update"
            git push -f origin automated/model-updates

            # Check if PR is already open
            PR_STATE=$(gh pr view automated/model-updates --json state -q .state 2>/dev/null || echo "NONE")
            if [[ "$PR_STATE" == "OPEN" ]]; then
              gh pr edit automated/model-updates \
                --title "🤖 Weekly OpenRouter Model Recommendations & Delta Update" \
                --body-file MODEL_RECOMMENDATIONS_REPORT.md
            elif [[ "$PR_STATE" == "CLOSED" ]]; then
              gh pr reopen automated/model-updates || true
              gh pr edit automated/model-updates \
                --title "🤖 Weekly OpenRouter Model Recommendations & Delta Update" \
                --body-file MODEL_RECOMMENDATIONS_REPORT.md
            else
              gh pr create --base main --head automated/model-updates \
                --title "🤖 Weekly OpenRouter Model Recommendations & Delta Update" \
                --body-file MODEL_RECOMMENDATIONS_REPORT.md
            fi
          fi
